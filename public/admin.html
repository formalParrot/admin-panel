<!DOCTYPE html>
<html>
    <head>
        <title>Admin</title>
        <link rel="stylesheet" href="https://justparrot.me/place/place.css">

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

        <style>
            .monsterrat {
                font-family: "Montserrat", sans-serif;
                font-optical-sizing: auto;
                font-weight: 600;
                font-style: normal;
            }
            .monsterrat-i {

                font-style: italic;
            }

            table {
                width: 100%;
            }

            }

        <style>

                position: fixed;
                inset: 0;

                align-items: center;

            }

                display: none;
                position: fixed;
                inset: 0;

                align-items: center;
                justify-content: center;
            }

            .tokenIssue-content {
                background: white;
                padding: 30px;
                border-radius: 15px;
                width: 400px;
            }

            .tokenIssue-show {
                display: none;
                position: fixed;
                inset: 0;
                background: rgba(0, 0, 0, 0.5);

                align-items: center;
                justify-content: center;
            }

            .tokenIssue-show-content {
                background: white;
                padding: 30px;

            .tokenAll {

                position: fixed;
                inset: 0;
                background: rgba(0, 0, 0, 0.5);

            }

            }
        </style>

        <style>
            .notification {
            padding: 8px;
            border-bottom: 1px solid #ddd;
            }

            .notification.unread {
            font-weight: bold;
            background: #f0f8ff;
            }

            .notification.read {
            opacity: 0.6;
            }

        <style>
            :root {
            --bg: #faf9f6;
            --surface: #ffffff;
            --border: #e4e1d8;
            --border-strong: #cfccc1;

            --ink: #211f1b;
            --ink-muted: #6e6b62;
            --ink-faint: #a8a49a;

            --accent: #b5501f;
            --accent-bg: #fbeee6;

            --status-active: #3f7d4b;
            --status-active-bg: #eaf4ec;
            --status-revoked: #8c8a82;
            --status-revoked-bg: #f0efeb;
            --status-expired: #a9861f;
            --status-expired-bg: #f8f1de;

            --radius: 8px;
            --radius-sm: 5px;

            --gap-0: 0;
            --gap-s: 8px;
            --gap-m: 16px;
            --gap-l: 28px;

            --shadow-modal: 0 12px 32px rgba(33, 31, 27, 0.18);
            }

            [data-theme="dark"] {
            --bg: #171613;
            --surface: #201f1b;
            --border: #34322c;
            --border-strong: #46443c;

            --ink: #f0eee7;
            --ink-muted: #a8a49a;
            --ink-faint: #6e6b62;

            --accent: #e0793e;
            --accent-bg: #3a2a1e;

            --status-active: #6bb679;
            --status-active-bg: #223a28;
            --status-revoked: #a8a49a;
            --status-revoked-bg: #2b2a26;
            --status-expired: #d6b24a;
            --status-expired-bg: #3a301a;

            --shadow-modal: 0 12px 32px rgba(0, 0, 0, 0.5);
            }

            [data-theme="high-contrast"] {
            --bg: #ffffff;
            --surface: #ffffff;
            --border: #000000;
            --border-strong: #000000;

            --ink: #000000;
            --ink-muted: #000000;
            --ink-faint: #333333;

            --accent: #b5501f;
            --accent-bg: #fbeee6;

            --status-active: #1a6b2a;
            --status-active-bg: #d4f0da;
            --status-revoked: #333333;
            --status-revoked-bg: #e0e0e0;
            --status-expired: #8a6500;
            --status-expired-bg: #f5ecc8;

            --shadow-modal: 0 12px 32px rgba(0, 0, 0, 0.3);
            }

            * {
            box-sizing: border-box;
            }

            html {
            color-scheme: light;
            }

            body {
            margin: 0;
            padding: 32px 40px 56px;
            background: var(--bg);
            color: var(--ink);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            font-size: 14px;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            }

            .monsterrat {
            font-family: "Montserrat", sans-serif;
            font-optical-sizing: auto;
            font-weight: 600;
            font-style: normal;
            }

            .monsterrat-i {
            font-family: "Montserrat", sans-serif;
            font-optical-sizing: auto;
            font-weight: 600;
            font-style: italic;
            }

            h1 {
            font-size: 22px;
            letter-spacing: -0.01em;
            margin: 0 0 4px;
            color: var(--ink);
            }

            h3 {
            font-size: 14px;
            margin: 0 0 14px;
            color: var(--ink-muted);
            }

            body > div.fc-c-c:first-of-type {
            flex-direction: row;
            align-items: baseline;
            justify-content: space-between;
            width: 100%;
            margin-bottom: 28px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
            }

            button {
            font-family: inherit;
            font-size: 13px;
            font-weight: 500;
            color: var(--ink);
            background: var(--surface);
            border: 1px solid var(--border-strong);
            border-radius: var(--radius-sm);
            padding: 8px 14px;
            cursor: pointer;
            transition: border-color 0.12s ease, background 0.12s ease;
            }

            button:hover {
            border-color: var(--ink-faint);
            background: #f5f4f0;
            }

            button:active {
            background: #ececE6;
            }

            button:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
            }

            #logout-btn {
            color: var(--ink-muted);
            }

            #issue,
            #tokenIssue-btn,
            #tokenRevoke-btn {
            color: var(--accent);
            border-color: #e4c1ac;
            background: var(--accent-bg);
            }

            #issue:hover,
            #tokenIssue-btn:hover,
            #tokenRevoke-btn:hover {
            background: #f6ddc9;
            border-color: var(--accent);
            }

            #revoke {
            color: var(--ink-muted);
            }

            .tokenIssue-content > button,
            .tokenIssue-show-content > button,
            .tokenRevoke-content > button,
            .tokenAll-content > button {
            align-self: flex-end;
            border: none;
            background: none;
            color: var(--ink-faint);
            font-size: 18px;
            line-height: 1;
            padding: 2px 4px;
            }

            .tokenIssue-content > button:hover,
            .tokenIssue-show-content > button:hover,
            .tokenRevoke-content > button:hover,
            .tokenAll-content > button:hover {
            color: var(--ink);
            background: none;
            }

            div[style*="border: 1.5px black solid"] {
            border: 1px solid var(--border) !important;
            border-radius: var(--radius) !important;
            background: var(--surface);
            }

            [data-theme="high-contrast"] div[style*="border: 1.5px black solid"] {
            border-width: 2px !important;
            }

            [data-theme="high-contrast"] table {
            border: 2px solid var(--border);
            }

            [data-theme="high-contrast"] thead th {
            border-bottom: 2px solid var(--border);
            }

            [data-theme="high-contrast"] #tokens tr {
            border-bottom: 2px solid var(--border);
            }

            [data-theme="high-contrast"] .notification {
            border-bottom: 2px solid var(--border);
            }

            [data-theme="high-contrast"] button {
            border-width: 2px;
            }

            [data-theme="high-contrast"] input {
            border-width: 2px;
            }

            table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            }

            thead th {
            font-size: 11px;
            font-weight: 600;
            text-transform: none;
            color: var(--ink-faint);
            border-bottom: 1px solid var(--border);
            padding: 6px 8px;
            }

            #tokens {
            color: var(--ink-muted);
            }

            #tokens tr {
            border-bottom: 1px solid var(--border);
            }

            #tokens tr:last-child {
            border-bottom: none;
            }

            #tokens td {
            padding: 10px 8px;
            color: var(--ink);
            }

            #tokens td:first-child {
            font-variant-numeric: tabular-nums;
            }

            .orange {
            color: var(--accent);
            font-weight: 500;
            }

            .gray {
            color: var(--ink-muted);
            }

            #tokens td:last-child {
            font-weight: 500;
            }

            input {
            font-family: inherit;
            font-size: 13px;
            color: var(--ink);
            background: var(--surface);
            border: 1px solid var(--border-strong);
            border-radius: var(--radius-sm);
            padding: 9px 11px;
            width: 100%;
            }

            input::placeholder {
            color: var(--ink-faint);
            }

            input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-bg);
            }

            form {
            width: 100%;
            }

            .tokenIssue,
            .tokenIssue-show,
            .tokenRevoke,
            .tokenAll {
            align-items: center;
            justify-content: center;
            background: rgba(33, 31, 27, 0.45);
            }

            .tokenIssue-content,
            .tokenIssue-show-content,
            .tokenRevoke-content,
            .tokenAll-content {
            background: var(--surface);
            border-radius: 12px;
            box-shadow: var(--shadow-modal);
            align-items: stretch;
            }

            .tokenIssue-content h2,
            .tokenRevoke-content h2 {
            font-size: 16px;
            margin: 0 0 4px;
            color: var(--ink);
            }

            #tokenIssue-show-txt {
            color: var(--accent);
            font-weight: 500;
            text-decoration: none;
            word-break: break-all;
            }

            #tokenIssue-show-txt:hover {
            text-decoration: underline;
            }

            #notification-bell {
            width: 100%;
            }

            #unread-count {
            display: inline-block;
            font-size: 12px;
            color: var(--ink-muted);
            }

            #notification-list {
            width: 100%;
            margin-top: 8px;
            }

            .notification {
            padding: 9px 4px;
            border-bottom: 1px solid var(--border);
            font-size: 13px;
            color: var(--ink-muted);
            cursor: pointer;
            }

            .notification:last-child {
            border-bottom: none;
            }

            .notification strong {
            color: var(--ink);
            font-weight: 600;
            margin-right: 4px;
            }

            .notification.unread {
            font-weight: 400;
            background: var(--accent-bg);
            color: var(--ink);
            border-radius: var(--radius-sm);
            padding-left: 8px;
            padding-right: 8px;
            }

            .notification.unread strong {
            color: var(--accent);
            }

            .notification.read {
            opacity: 1;
            }
        </style>

    </head>
    <body data-theme="">
        <div class="fc-c-c gap-0">
            <h1 class=" monsterrat">My Admin Panel</h1>

            <button id="logout-btn" style="margin-bottom: 10px;">Log Out</button>

            <button id="theme-toggle" style="margin-bottom: 10px;">Dark mode</button>
        </div>

        <div>
            <div class="f-c-c gap-l">
                <div style="border: 1.5px black solid; padding: 5px; border-radius: 7px;">
                    <h3 class="monsterrat-i t-c-c">Tokens</h3>
                    <table>
                        <thead>
                            <tr>
                                <th class="">ID</th>
                                <th class="">User</th>
                                <th class="">Site</th>
                                <th class="">Expires</th>
                                <th class="">Status</th>
                            </tr>
                        </thead>

                        <tbody id="tokens" class="gray">
                            <!-- Rows get inserted here -->
                        </tbody>
                    </table>
                    <div class="f-c-c gap-m" style="margin-top: 15px; margin-bottom: 15px;">
                        <button id="issue">Issue Token</button>
                        <button id="revoke">Revoke Token</button>
                        <button id="view-all">View All</button>
                    </div>
                    <div class="fc-c-c tokenIssue" id="tokenIssue">
                        <div class="tokenIssue-content g-c-c">
                            <button onclick="closePopup('tokenIssue')">×</button>
                            <h2>Issue an Access Token</h2>

                            <form id="issue-form" class="g-c-c gap-s">
                                <input placeholder="Username" id="tokenIssue-user" >
                                <input placeHolder="Site" id="tokenIssue-site">
                                <input type="datetime-local" id="tokenIssue-expiry">

                               <button type="button" id="tokenIssue-btn">Request</button>
                            </form>
                        </div>
                    </div>
                    <div class="fc-c-c tokenIssue-show" id="tokenIssue-show">
                        <div class="tokenIssue-show-content g-c-c gap-m">

                            <a id="tokenIssue-show-txt">Activate Link</a>
                        </div>
                    </div>

                            <button onclick="closePopup('tokenRevoke')">×</button>

                            </form>
                        </div>

                    <div class="fc-c-c tokenAll" id="tokenAll">
                        <div class="tokenAll-content g-c-c" style="max-height: 80vh; overflow-y: auto;">
                            <button onclick="closePopup('tokenAll')">×</button>
                            <h2>All Tokens</h2>
                            <table>
                                <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>User</th>
                                        <th>Site</th>
                                        <th>Expires</th>
                                        <th>Status</th>
                                    </tr>
                                </thead>
                                <tbody id="all-tokens" class="gray"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
                <div class="" style="display: flex; flex-wrap: wrap; gap: 15px;">
                    <div style="border: 1.5px black solid; padding: 15px; border-radius: 7px; flex: 1 1 250px;">
                        <h3 class="monsterrat-i t-c-c">Notifications</h3>

                        <div id="notification-bell">
                            <span class="monsterrat" style="padding-bottom:5px;"id="unread-count"></span>
                            <div id="notification-list"></div>
                        </div>
                    </div>

                    <div style="border: 1.5px black solid; padding: 15px; border-radius: 7px; flex: 1 1 250px;">
                        <h3>Test wrap</h3>
                    </div>

                    <div style="border: 1.5px black solid; padding: 15px; border-radius: 7px; flex: 1 1 250px;">
                        <h3>..</h3>
                    </div>
                </div>
            </div>
        </div>
    </body>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        document.getElementById("logout-btn").addEventListener("click", async () => {
          const res = await fetch("/admin/logout", { method: "POST", headers: { "Content-Type": "application/json" } });
          if (res.ok) window.location.reload();
          else console.error("Logout failed", res.status);
        });
      });
    </script>

    <!-- notifications -->
    <script>
      function showMissedNotifications() {
        fetch('/admin/notifications/missed')
          .then(res => res.json())
          .then(missed => {
            if (missed.length > 0) {
              console.log(`You missed ${missed.length} notifications:`, missed);
              renderMissedPopup(missed);
            }
            return fetch('/admin/notifications/mark-seen', { method: 'POST' });
          });
      }

      document.addEventListener('DOMContentLoaded', () => {
        showMissedNotifications();
      });
    </script>

    <!-- token works -->
    <script>
        function getExpirySeconds() {
            const value = document.getElementById("tokenIssue-expiry").value;

            if (!value) return null;

            const expiryTimestamp = Math.floor(new Date(value).getTime() / 1000);
            const nowTimestamp = Math.floor(Date.now() / 1000);

            return expiryTimestamp - nowTimestamp;
        }

        function openPopup(popup) {
            document.getElementById(popup).style.display = "flex";
        }

        function closePopup(popup) {
            document.getElementById(popup).style.display = "none";
        }

        function closeForm(la) {
            la.reset()
        }

      document.getElementById("issue").addEventListener("click", async () => {
        openPopup("tokenIssue")
      })

      document.getElementById("revoke").addEventListener("click", async () => {
        openPopup("tokenRevoke")
      })

      document.getElementById("view-all").addEventListener("click", () => {
        openPopup("tokenAll")
      })

      document.getElementById("tokenIssue-btn").addEventListener("click", async () => {
        const user = document.getElementById("tokenIssue-user").value
        const site = document.getElementById("tokenIssue-site").value

        const expiry = getExpirySeconds()

        const payload = {
            action: "issue",
            user,
            site,
            expiresInSeconds: expiry
        };

        const response = await fetch("/admin/lock", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(payload)
        });


        const data = await response.json();

        if (data.id) {
          console.log(data)
        }
        loadTokens()

        closePopup("tokenIssue")
        openPopup("tokenIssue-show")
        document.getElementById("tokenIssue-show-txt").href = data.activate_uri;
      })

      document.getElementById("tokenRevoke-btn").addEventListener("click", async () => {
        const form = document.getElementById("revoke-form")
        const id = document.getElementById("tokenRevoke-id").value

        const payload = {
            action: "revoke",
            id,
        };

        const response = await fetch("/admin/lock", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(payload)
        });


        const data = await response.json();
        loadTokens()


        closeForm(form)
        closePopup("tokenRevoke")
      })
    </script>
    <!-- token render -->
    <script>
      let allTokens = [];

      function renderTokensRow(token) {
        return `
            <td class="orange">${token.id}</td>
            <td>${token.user}</td>
            <td>${token.site}</td>
            <td>${new Date(token.expires_at * 1000).toLocaleString(undefined, {
              year: 'numeric',
              month: 'numeric',
              hour12: false,
              day: 'numeric',
              hour: '2-digit',
              minute: '2-digit'
            })}</td>
            <td>
              ${token.revoked ? "Revoked" : (new Date(token.expires_at * 1000) < new Date() ? "Expired" : "Active")}
            </td>
        `;
      }

      function renderTokenTable(tbodyId, tokens) {
        const tbody = document.getElementById(tbodyId);
        tbody.innerHTML = "";
        for (const token of tokens) {
          const row = document.createElement("tr");
          row.innerHTML = renderTokensRow(token);
          tbody.appendChild(row);
        }
      }

      async function loadTokens() {
          const response = await fetch("/admin/lock", {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({ action: "tokens" })
          });
          allTokens = await response.json();

          renderTokenTable("tokens", allTokens.slice(-10).reverse());
          renderTokenTable("all-tokens", [...allTokens].reverse());
      }

      loadTokens();

      const intervalId = setInterval(() => {
        loadTokens();
      }, 10000);
    </script>
    <!-- notif render -->
    <script>
      let notifications = [];

      function render() {
        const list = document.getElementById('notification-list');
        const countEl = document.getElementById('unread-count');
        const unreadCount = notifications.filter(n => !n.read).length;
        countEl.textContent = 'Unread: ' + (unreadCount > 0 ? unreadCount : '');

        // unread first, newest first within each group
        const sorted = [...notifications].sort((a, b) => {
          if (a.read !== b.read) return a.read ? 1 : -1; // unread (false) sorts before read (true)
          return new Date(b.createdAt) - new Date(a.createdAt);
        });

        const recent = sorted.slice(0, 5);

        list.innerHTML = recent
          .map(n => `
            <div class="notification ${n.read ? 'read' : 'unread'}" data-id="${n.id}">
              <strong>${n.service}</strong>: ${n.message}
            </div>
          `)
          .join('');
      }

      // mark as read
      document.getElementById('notification-list').addEventListener('click', (e) => {
        const el = e.target.closest('.notification');
        if (!el) return;
        const id = el.dataset.id;

        fetch(`/admin/notifications/${id}/read`, { method: 'PATCH' })
          .then(() => {
            const n = notifications.find(n => n.id == id);
            if (n) n.read = true;
            render();
          });
      });

      fetch('/admin/notifications')
        .then(res => res.json())
        .then(data => {
          notifications = data;
          render();
        });

      const source = new EventSource('/admin/notifications/stream');

      source.onmessage = (event) => {
        const notification = JSON.parse(event.data);
        notifications.unshift(notification);
        render();
      };


      source.onerror = (err) => {
        console.error('SSE connection error:', err);
      };
    </script>
    <!-- theme switcher -->
    <script>
      const root = document.documentElement;
      const saved = localStorage.getItem('theme');
      if (saved) {
        root.setAttribute('data-theme', saved);
        document.getElementById('theme-toggle').textContent = { light: 'Dark mode', dark: 'High contrast', 'high-contrast': 'Light mode' }[saved];
      }

      document.getElementById('theme-toggle').addEventListener('click', () => {
        const current = root.getAttribute('data-theme') || 'light';
        const themes = ['light', 'dark', 'high-contrast'];
        const next = themes[(themes.indexOf(current) + 1) % themes.length];
        if (next === 'light') root.removeAttribute('data-theme');
        else root.setAttribute('data-theme', next);
        document.getElementById('theme-toggle').textContent = { light: 'Dark mode', dark: 'High contrast', 'high-contrast': 'Light mode' }[next];
        localStorage.setItem('theme', next);
      });
    </script>
</html>
